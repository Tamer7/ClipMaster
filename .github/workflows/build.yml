name: Build/Release

# Add permissions block at the top level
permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set version based on tag or commit
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.0-dev.{0}', github.sha) }}
        shell: pwsh
        run: |
          # Update version in package.json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = "$env:VERSION"
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json
          
          npm run build
          if ("${{ matrix.os }}" -eq "windows-latest") {
            npm run build:win
          } elseif ("${{ matrix.os }}" -eq "macos-latest") {
            npm run build:mac
          } else {
            npm run build:linux
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/latest*.yml
            release/*-mac.zip
          if-no-files-found: warn

      - name: Get latest tag
        id: get_latest_tag
        if: github.ref == 'refs/heads/develop'
        shell: pwsh
        run: |
          git fetch --tags --force
          try {
            $latestTag = $(git describe --tags --abbrev=0)
            if ([string]::IsNullOrEmpty($latestTag)) {
              $latestTag = "v0.1.0"
            }
          } catch {
            $latestTag = "v0.1.0"
          }
          "LATEST_TAG=$latestTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.LATEST_TAG }}
          files: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/latest*.yml
            release/*-mac.zip
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
